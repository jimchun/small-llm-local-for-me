<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little LLM - 本地知识问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fff;
            color: #222;
            line-height: 1.6;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        h1 { font-size: 22px; }
        .mode-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            display: none;
        }
        .mode-badge.chat { background: #e0f2fe; color: #0369a1; display: inline-block; }
        .mode-badge.knowledge { background: #dcfce7; color: #166534; display: inline-block; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #888;
        }
        .toolbar button {
            padding: 4px 10px;
            background: transparent;
            color: #666;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }
        .toolbar button:hover { background: #f0f0f0; }
        .chat-area {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 16px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            background: #fafafa;
            margin-bottom: 16px;
        }
        .chat-msg {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            max-width: 90%;
            word-break: break-word;
        }
        .chat-msg.user {
            background: #e3f2fd;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 2px;
        }
        .chat-msg.assistant {
            background: #fff;
            border: 1px solid #eee;
            border-bottom-left-radius: 2px;
        }
        .chat-msg .role {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        .chat-msg .content {
            font-size: 14px;
            white-space: pre-wrap;
        }
        .chat-msg .sources {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px dashed #ddd;
            font-size: 12px;
        }
        .chat-msg .sources a {
            color: #0066cc;
            text-decoration: none;
            display: block;
            margin-top: 2px;
        }
        .chat-msg .sources a:hover { text-decoration: underline; }
        .chat-msg.loading {
            background: #f0f0f0;
            color: #888;
            font-style: italic;
        }
        .input-area {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #333; }
        button.send-btn {
            padding: 10px 20px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        button.send-btn:hover { background: #444; }
        button.send-btn:disabled { background: #999; cursor: not-allowed; }
        .empty-hint {
            text-align: center;
            color: #aaa;
            padding: 40px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Little LLM</h1>
        <span id="modeBadge" class="mode-badge"></span>
    </div>
    <p class="subtitle">本地运行 · 强制引用 · 拒绝幻觉 · 支持多轮对话</p>

    <div class="toolbar">
        <span id="sessionInfo">会话: default</span>
        <button onclick="clearChat()">清空对话</button>
    </div>

    <div id="chatArea" class="chat-area">
        <div class="empty-hint" id="emptyHint">输入问题开始对话，支持知识问答和日常聊天</div>
    </div>

    <div class="input-area">
        <input type="text" id="question" placeholder="输入你的问题，例如：什么是量子计算？" autofocus>
        <button id="askBtn" class="send-btn" onclick="askQuestion()">发送</button>
    </div>

    <script>
        // API 地址：优先使用相对路径，支持 http 和 file 协议
        const API_BASE = window.location.protocol === 'file:' 
            ? 'http://127.0.0.1:9821'
            : '';
        
        const SESSION_ID = 'default';
        const questionInput = document.getElementById('question');
        const askBtn = document.getElementById('askBtn');
        const chatArea = document.getElementById('chatArea');
        const emptyHint = document.getElementById('emptyHint');
        const modeBadge = document.getElementById('modeBadge');

        // 回车键提交
        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') askQuestion();
        });

        // 加载历史对话
        window.addEventListener('load', loadHistory);

        async function loadHistory() {
            try {
                const resp = await fetch(API_BASE + '/history/' + SESSION_ID);
                if (!resp.ok) return;
                const data = await resp.json();
                if (data.history && data.history.length > 0) {
                    emptyHint.style.display = 'none';
                    data.history.forEach(item => {
                        appendMessage('user', item.question, [], null);
                        appendMessage('assistant', item.answer, item.sources || [], item.mode);
                    });
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            } catch (e) {
                console.error('加载历史失败:', e);
            }
        }

        function appendMessage(role, content, sources, mode) {
            emptyHint.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            
            const roleLabel = role === 'user' ? '你' : 'AI';
            let html = '<div class="role">' + roleLabel + '</div>';
            html += '<div class="content">' + escapeHtml(content) + '</div>';
            
            if (sources && sources.length > 0) {
                html += '<div class="sources"><strong>引用来源:</strong>';
                sources.forEach(src => {
                    html += '<a href="' + src.url + '" target="_blank">' + escapeHtml(src.title) + '</a>';
                });
                html += '</div>';
            }
            
            div.innerHTML = html;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // 显示用户消息
            appendMessage('user', question, [], null);

            // 显示加载状态
            askBtn.disabled = true;
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'chat-msg loading';
            loadingDiv.textContent = 'AI 正在思考...';
            chatArea.appendChild(loadingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const resp = await fetch(API_BASE + '/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, session_id: SESSION_ID })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || '请求失败');
                }

                const data = await resp.json();

                // 移除加载提示
                loadingDiv.remove();

                // 显示 AI 回复
                appendMessage('assistant', data.answer, data.sources, data.mode);

                // 更新模式标记
                if (data.mode === 'chat') {
                    modeBadge.textContent = '聊天模式';
                    modeBadge.className = 'mode-badge chat';
                } else {
                    modeBadge.textContent = '知识模式';
                    modeBadge.className = 'mode-badge knowledge';
                }

            } catch (err) {
                loadingDiv.remove();
                appendMessage('assistant', '错误: ' + err.message, [], null);
            } finally {
                askBtn.disabled = false;
                questionInput.value = '';
                questionInput.focus();
            }
        }

        async function clearChat() {
            if (!confirm('确定要清空当前对话吗？')) return;
            try {
                await fetch(API_BASE + '/history/' + SESSION_ID, { method: 'DELETE' });
                chatArea.innerHTML = '';
                emptyHint.style.display = 'block';
                chatArea.appendChild(emptyHint);
                modeBadge.className = 'mode-badge';
                modeBadge.textContent = '';
            } catch (e) {
                alert('清空失败: ' + e.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
